services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-SkyGuard2026!}
      - GO2RTC_URL=http://go2rtc:1984
      - S3_ENDPOINT=${S3_ENDPOINT:-https://s3api1.skyconnection.id}
      - S3_REGION=${S3_REGION:-us-west-1}
      - S3_BUCKET=${S3_BUCKET:-frigate}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-73IGfrigateTCD0ytq}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-Np6XMltnNIsKzSLDjZzg9umAJGMfx3iKe1gsio3e}
      - PARADEDB_URL=${PARADEDB_URL:-postgresql://postgres:dNGwXb9OCrJNNaJMoKI7@mail-paradedb-46ygk4-postgres-1:5432/app}
      - SYNC_KEY=${SYNC_KEY:-skyguard_sync_secret_key_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - go2rtc
    networks:
      - skyguard-network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.skyguard.rule=Host(`skyguard.skyconnection.id`)"
      - "traefik.http.routers.skyguard.entrypoints=web,websecure"
      - "traefik.http.services.skyguard.loadbalancer.server.port=3000"

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    networks:
      - skyguard-network

  tailscale:
    image: tailscale/tailscale:latest
    hostname: skyguard-dokploy
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    command: >
      sh -c "
        tailscaled --statedir=/var/lib/tailscale --tun=tailscale0 &
        sleep 2;
        if [ -n \"$$TS_AUTHKEY\" ]; then
          tailscale up --authkey=\"$$TS_AUTHKEY\" --accept-routes --hostname=skyguard-dokploy;
        else
          tailscale up --accept-routes --hostname=skyguard-dokploy --timeout=3600s;
        fi
        wait
      "
    restart: unless-stopped

volumes:
  tailscale-data:
    driver: local

networks:
  skyguard-network:
    driver: bridge
  dokploy-network:
    external: true
